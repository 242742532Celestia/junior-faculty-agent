name: Release

# 打 tag 即出包 + 发 Release。
#   git tag v1.0.0 && git push origin v1.0.0
# 产物：① 三档分发包 ② GitHub 源码包 ③ 发布说明
#
# 🔴 不往仓库里塞任何密钥：GitHub Actions 自带 GITHUB_TOKEN，
#    发 Release 用它就够，不需要配置任何 secret。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 出三档分发包
        run: |
          python scripts/package_release.py --build
          python scripts/package_release.py --build --profile teaching
          python scripts/package_release.py --build --profile research

      - name: 出 GitHub 源码包与发布说明
        run: python scripts/github_release.py --build

      # 🔴 发布前最后一道：把产物**真的解开跑一遍**。
      #    文件清单对、sha256 对、包能解开 —— 这三件事全过，仍可能一跑就炸
      #    （分档包曾因变量未绑定而崩在克隆方第一次运行时）。
      #    用 glob 而不是写死版本号 —— 版本一升，写死的路径就断了。
      #    源码包走 github_release.py --verify：它带顶层目录，
      #    MANIFEST 不在根部，分档包的校验器读不到（那是**两种包结构**，
      #    不是同一个包有两种状态）。
      - name: 产物复核
        run: |
          for z in dist/*.zip; do
            case "$z" in
              *-source.zip) continue ;;
            esac
            echo "== $z =="
            python scripts/package_release.py --verify "$z"
          done
          python scripts/github_release.py --verify

      - name: 挂到 GitHub Release
        # 🔴 用 runner 自带的 `gh` CLI，**不用第三方 action** ——
        #    发布路径上少一个供应链依赖（`gh` 随 GitHub runner 提供）。
        #    重跑本 workflow 时 Release 已存在 ⇒ 改成覆盖上传。
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/RELEASE_NOTES.md --clobber
            gh release edit "$TAG" --notes-file dist/RELEASE_NOTES.md --title "$TAG"
          else
            gh release create "$TAG" --title "$TAG" --notes-file dist/RELEASE_NOTES.md \
              dist/*.zip dist/RELEASE_NOTES.md
          fi
