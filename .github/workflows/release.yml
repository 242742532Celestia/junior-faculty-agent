name: Release

# 打 tag 即出包 + 发 Release。
#   git tag v1.0.0 && git push origin v1.0.0
# 产物：① 三档分发包 ② GitHub 源码包 ③ 发布说明
#
# 🔴 不往仓库里塞任何密钥：GitHub Actions 自带 GITHUB_TOKEN，
#    发 Release 用它就够，不需要配置任何 secret。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 出三档分发包
        run: |
          python scripts/package_release.py --build
          python scripts/package_release.py --build --profile teaching
          python scripts/package_release.py --build --profile research

      - name: 出 GitHub 源码包与发布说明
        run: python scripts/github_release.py --build

      # 🔴 发布前最后一道：把产物**真的解开跑一遍**。
      #    文件清单对、sha256 对、包能解开 —— 这三件事全过，仍可能一跑就炸
      #    （分档包曾因变量未绑定而崩在克隆方第一次运行时）。
      - name: 产物复核
        run: |
          python scripts/package_release.py --verify dist/junior-faculty-agent-1.0.0.zip
          python scripts/package_release.py --verify dist/junior-faculty-agent-1.0.0-teaching.zip
          python scripts/package_release.py --verify dist/junior-faculty-agent-1.0.0-research.zip
          python scripts/github_release.py --verify

      - name: 挂到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/junior-faculty-agent-1.0.0.zip
            dist/junior-faculty-agent-1.0.0-teaching.zip
            dist/junior-faculty-agent-1.0.0-research.zip
            dist/junior-faculty-agent-1.0.0-source.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
