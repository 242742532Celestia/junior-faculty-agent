name: CI

# 🔴 这个 workflow **不引入任何新判据** —— 它只把仓库里已有的机器判据接到 CI 上。
#    换句话说：本地跑绿了不算数，GitHub 上也必须绿。
#    改判据 = 改 scripts/verify_repo.py / demo/selfcheck.py，不是改这里。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 🔴 中文 Windows 控制台默认 GBK：子进程打 ✅ 会 UnicodeEncodeError 当场死，
#    父进程只看到「退出码 1」⇒ 判据红在错的原因上。
#    所以这里把 PYTHONIOENCODING 钉在 **job 级**，让每个步骤都拿到。
env:
  PYTHONIOENCODING: utf-8

jobs:
  guards:
    name: 守卫 ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows 必须保留：GBK/编码类问题只在 Windows 暴露，
        # 只跑 ubuntu 会把「自己母语环境下不绿」的守卫漏过去。
        os: [ubuntu-latest, windows-latest]
        # 3.9 是本项目的**兼容下限**（纯标准库、Python 3.9 兼容写法）；
        # 3.13 是当代版本。两者都跑，才谈得上「兼容」。
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 环境自述
        run: python -c "import sys; print(sys.version)"

      # ── ① 巡检器自身 ──
      - name: 巡检器自检
        run: python scripts/skill_scan.py --selftest

      # ── ② 文档 ↔ 现实一致性（README 写的数字必须等于磁盘实际）──
      - name: 文档↔现实一致性守卫
        run: python scripts/verify_repo.py

      # ── ③ 改写清单结构合规 + 全仓交叉引用 ──
      #    无上游原文时的口径（克隆方默认看到的就是这个数）。
      - name: 改写清单结构合规
        run: python scripts/verify_rewrite.py

      # ── ④ 判据的变异测试：证明判据**会红**而不是空转 ──
      - name: 判据变异测试（Demo 自检）
        run: python demo/selftest.py

      # ── ⑤ 大纲唯一事实源：教案/课件/讲义都必须由大纲派生 ──
      - name: 大纲唯一事实源
        run: python demo/outline.py --check

      # ── ⑥ 离线端到端：产出四件交付物且零 ERROR ──
      - name: 离线 Demo 端到端
        run: python demo/run_demo.py --out demo/out

      # ── ⑦ 三档出包 + 「克隆即用」复核 ──
      #    注意：这里验的是**分发物**，不是仓库 —— 包里少一个文件也要红。
      - name: 出包并校验（full）
        run: python scripts/package_release.py --build
      - name: 出包并校验（teaching）
        run: python scripts/package_release.py --build --profile teaching
      - name: 出包并校验（research）
        run: python scripts/package_release.py --build --profile research

      # ── ⑧ GitHub 开源包（源码包 + 发布说明）──
      - name: GitHub 开源包
        run: python scripts/github_release.py --build

  # 🔴 守卫自己的变异测试**不放 CI 里**：它要跑 50+ 次全量守卫，
  #    单次 20–30 分钟，在 CI 里没有意义（而且它验证的是「守卫会红」，
  #    不是「仓库内容对不对」）。改守卫后本地必须跑：
  #        python scripts/test_verify_repo.py
  #    这条纪律写进 CONTRIBUTING.md。
